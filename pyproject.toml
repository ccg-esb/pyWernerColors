[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wernercolors"
version = "0.1.0"
description = "Werner's Nomenclature of Colours palettes for Python and Matplotlib"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC0-1.0"}
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dataframe = ["pandas>=1.5"]
dev = ["pytest>=7", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/spiritu-santi/WernerColors"
Repository = "https://github.com/spiritu-santi/WernerColors"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wernercolors = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
